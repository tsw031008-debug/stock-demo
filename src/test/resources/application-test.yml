spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stock_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    cn.djct.stockdemo: INFO

stock:
  basic:
    sync:
      enabled: false
  daily-quote:
    sync:
      enabled: false
  fund-flow:
    sync:
      enabled: false
  market-level:
    daily-turnover:
      sync:
        enabled: false
  index-divergence:
    minute-quote:
      sync:
        enabled: false
